<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理者ダッシュボード</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6 font-sans">
  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- 店舗追加セクション -->
    <div class="bg-white rounded-xl shadow-md p-6">
      <h2 class="text-xl font-bold text-gray-800 mb-4">店舗の管理 (追加)</h2>
      <div class="flex space-x-2">
        <input type="text" id="newStoreName" class="flex-1 p-3 border rounded-lg bg-gray-50 outline-none focus:ring-2 focus:ring-blue-500" placeholder="新しい店舗名を入力">
        <button id="addStoreBtn" class="bg-blue-600 text-white font-bold px-6 py-3 rounded-lg shadow hover:bg-blue-700">店舗を追加</button>
      </div>
    </div>

    <!-- ライブ集計セクション -->
    <div class="bg-white rounded-xl shadow-md p-6">
      <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center">
        <span class="w-3 h-3 bg-red-500 rounded-full mr-2 animate-pulse"></span> 全店舗ライブ集計
      </h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-gray-800 text-white">
              <th class="p-3 rounded-tl-lg">店舗名</th>
              <th class="p-3">回答数</th>
              <th class="p-3 rounded-tr-lg">NPSスコア</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="text-gray-700">
            <!-- 動的追加 -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- 全回答コメント一覧セクション -->
    <div class="bg-white rounded-xl shadow-md p-6">
      <h2 class="text-xl font-bold text-gray-800 mb-4">新着の回答コメント一覧</h2>
      <div id="adminCommentList" class="space-y-4">
        <!-- 動的追加 -->
      </div>
    </div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDx8Q0of4f2AD-nChSIBmEr36Hn-2rQt-4",
      authDomain: "shoppana-nps-app-nodelete.firebaseapp.com",
      projectId: "shoppana-nps-app-nodelete",
      storageBucket: "shoppana-nps-app-nodelete.firebasestorage.app",
      messagingSenderId: "24600332490",
      appId: "1:24600332490:web:5c0a802af1a301d1a7cc33"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const escapeHTML = str => (str || '').replace(/[&<>'"]/g, tag => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'}[tag]));

    document.getElementById('addStoreBtn').addEventListener('click', async () => {
      const name = document.getElementById('newStoreName').value.trim();
      if (!name) return;
      await addDoc(collection(db, "stores"), { name: name });
      document.getElementById('newStoreName').value = '';
      alert(`${name} を追加しました`);
    });

    let storesList = [];
    let surveysList = [];

    const renderDashboard = () => {
      let tableHtml = '';
      storesList.forEach(storeName => {
        const storeSurveys = surveysList.filter(s => s.store === storeName);
        const count = storeSurveys.length;
        
        const promoters = storeSurveys.filter(s => s.nps >= 9).length;
        const detractors = storeSurveys.filter(s => s.nps <= 6).length;
        const npsScore = count === 0 ? 0 : Math.round(((promoters / count) - (detractors / count)) * 100);
        
        tableHtml += `<tr class="border-b">
          <td class="p-3 font-semibold">${escapeHTML(storeName)}</td>
          <td class="p-3">${count}</td>
          <td class="p-3 text-blue-600 font-bold">${npsScore}</td>
        </tr>`;
      });
      document.getElementById('tableBody').innerHTML = tableHtml || '<tr><td colspan="3" class="p-3 text-center text-gray-500">店舗が登録されていません</td></tr>';

      const sortedSurveys = [...surveysList].sort((a, b) => (b.timestamp?.toMillis() || 0) - (a.timestamp?.toMillis() || 0));
      let commentHtml = '';
      sortedSurveys.forEach(data => {
        const date = data.timestamp ? new Date(data.timestamp.toMillis()).toLocaleString('ja-JP') : '送信中...';
        const npsLabel = data.nps >= 9 ? '推奨者' : data.nps >= 7 ? '中立者' : '期待未達者';
        commentHtml += `
          <div class="bg-gray-50 p-4 rounded-xl shadow-sm border-l-4 ${data.nps >= 9 ? 'border-green-500' : data.nps <= 6 ? 'border-red-500' : 'border-yellow-500'}">
            <div class="flex justify-between items-center text-xs text-gray-500 mb-2">
              <span class="font-bold text-blue-600">${escapeHTML(data.store)}</span>
              <span>${date} / ${escapeHTML(data.gender)} / ${escapeHTML(data.time)}</span>
            </div>
            <div class="flex items-center space-x-2 mb-2">
              <span class="bg-white px-2 py-0.5 rounded border text-sm font-bold text-gray-700">NPS: ${data.nps}（${npsLabel}）</span>
            </div>
            <p class="text-gray-700 text-sm whitespace-pre-wrap">${escapeHTML(data.reason) || '<span class="text-gray-400">理由の記入なし</span>'}</p>
          </div>
        `;
      });
      document.getElementById('adminCommentList').innerHTML = commentHtml || '<p class="text-gray-500 text-center py-4">まだ回答がありません</p>';
    };

    onSnapshot(collection(db, "stores"), (snapshot) => {
      storesList = [];
      snapshot.forEach(doc => storesList.push(doc.data().name));
      renderDashboard();
    });

    onSnapshot(collection(db, "surveys"), (snapshot) => {
      surveysList = [];
      snapshot.forEach(doc => surveysList.push(doc.data()));
      renderDashboard();
    });
  </script>
</body>
</html>
