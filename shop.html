<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>店舗ダッシュボード</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 p-4 sm:p-6" style="font-family: 'Noto Sans JP', sans-serif;">
  <div class="max-w-3xl mx-auto space-y-6 sm:space-y-8">
    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 sm:p-8">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-3">
        <h2 id="storeTitle" class="text-2xl sm:text-3xl font-bold text-slate-800 tracking-tight">店舗データを読み込み中...</h2>
        <span id="targetStoreBadge" class="bg-indigo-50 text-indigo-700 border border-indigo-100 text-sm font-semibold px-4 py-1.5 rounded-full">専用ビュー</span>
      </div>
      <div class="grid grid-cols-2 gap-4 sm:gap-6 mt-2">
        <div class="bg-slate-50 border border-slate-100 p-5 sm:p-6 rounded-xl text-center flex flex-col justify-center">
          <p class="text-sm sm:text-base font-medium text-slate-500 mb-2">総回答数</p>
          <p class="text-4xl sm:text-5xl font-bold text-slate-800"><span id="count">0</span><span class="text-lg sm:text-xl text-slate-500 ml-1 font-medium">件</span></p>
        </div>
        <div class="bg-slate-50 border border-slate-100 p-5 sm:p-6 rounded-xl text-center flex flex-col justify-center">
          <p class="text-sm sm:text-base font-medium text-slate-500 mb-2">NPSスコア</p>
          <p class="text-4xl sm:text-5xl font-bold text-indigo-600" id="npsScore">0</p>
        </div>
      </div>
    </div>
    
    <div>
      <h3 class="text-xl sm:text-2xl font-bold text-slate-800 mb-4 px-1">新着の回答コメント</h3>
      <div id="responseList" class="space-y-4 sm:space-y-5">
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDx8Q0of4f2AD-nChSIBmEr36Hn-2rQt-4",
      authDomain: "shoppana-nps-app-nodelete.firebaseapp.com",
      projectId: "shoppana-nps-app-nodelete",
      storageBucket: "shoppana-nps-app-nodelete.firebasestorage.app",
      messagingSenderId: "24600332490",
      appId: "1:24600332490:web:5c0a802af1a301d1a7cc33"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const targetStore = urlParams.get('store');

    if (targetStore) {
      document.getElementById('storeTitle').innerText = `${targetStore} の回答データ`;
    } else {
      document.getElementById('storeTitle').innerText = '店舗名が指定されていません';
      document.getElementById('targetStoreBadge').className = 'bg-sky-50 text-sky-700 border border-sky-100 text-sm font-semibold px-4 py-1.5 rounded-full';
      document.getElementById('targetStoreBadge').innerText = 'エラー';
    }

    const escapeHTML = str => (str || '').replace(/[&<>'"]/g, tag => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'}[tag]));

    let allSurveys = [];

    const renderResponses = () => {
      if (!targetStore) {
        document.getElementById('responseList').innerHTML = '<p class="text-sky-500 text-center py-8 text-base bg-white rounded-xl shadow-sm">URLに ?store=店舗名 を指定してください。</p>';
        return;
      }

      const filtered = allSurveys
        .filter(s => s.store === targetStore)
        .sort((a, b) => (b.timestamp?.toMillis() || 0) - (a.timestamp?.toMillis() || 0));

      const count = filtered.length;
      const promoters = filtered.filter(s => s.nps >= 9).length;
      const detractors = filtered.filter(s => s.nps <= 6).length;
      const npsScore = count === 0 ? 0 : Math.round(((promoters / count) - (detractors / count)) * 100);

      document.getElementById('count').innerText = count;
      document.getElementById('npsScore').innerText = npsScore;

      let html = '';
      filtered.forEach(data => {
        const date = data.timestamp ? new Date(data.timestamp.toMillis()).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '送信中...';
        const npsLabel = data.nps >= 9 ? '推奨者' : data.nps >= 7 ? '中立者' : '期待未達者';
        
        const bgColor = data.nps >= 9 ? 'bg-pink-50 border-pink-400' : data.nps >= 7 ? 'bg-green-50 border-green-400' : 'bg-sky-50 border-sky-400';
        const textColor = data.nps >= 9 ? 'text-pink-800' : data.nps >= 7 ? 'text-green-800' : 'text-sky-800';
        const iconFile = data.nps >= 9 ? 'lunchmap01.webp' : data.nps >= 7 ? 'lunchmap02.webp' : 'lunchmap03.webp';
        
        html += `
          <div class="p-5 sm:p-6 rounded-2xl shadow-sm border-l-4 ${bgColor} transition-all hover:shadow-md">
            <div class="flex justify-between items-start gap-3 sm:gap-4">
              <div class="space-y-3 flex-1">
                <div class="flex flex-col sm:flex-row sm:items-center text-sm text-slate-500 gap-1 font-medium">
                  <span>${date}</span>
                  <span>${escapeHTML(data.gender)} | ${escapeHTML(data.time)}</span>
                </div>
                <div>
                  <span class="bg-white border border-slate-200 font-bold px-3 py-1.5 rounded-lg text-sm sm:text-base ${textColor} shadow-sm inline-block">NPS: ${data.nps}（${npsLabel}）</span>
                </div>
              </div>
              <img src="${iconFile}" alt="${npsLabel}アイコン" class="w-14 h-14 sm:w-16 sm:h-16 flex-shrink-0 object-contain">
            </div>
            <p class="text-slate-800 text-base sm:text-lg mt-3 whitespace-pre-wrap leading-relaxed">${escapeHTML(data.reason) || '<span class="text-slate-400 italic">理由の記入なし</span>'}</p>
          </div>
        `;
      });
      document.getElementById('responseList').innerHTML = html || '<p class="text-slate-500 text-center py-8 text-base bg-white rounded-xl shadow-sm">まだ回答がありません</p>';
    };

    onSnapshot(collection(db, "surveys"), (snapshot) => {
      allSurveys = [];
      snapshot.forEach(doc => allSurveys.push(doc.data()));
      renderResponses();
    });
  </script>
</body>
</html>
