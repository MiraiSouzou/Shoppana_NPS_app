<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>店舗ダッシュボード</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-2 sm:p-4 font-sans">
  <div class="max-w-2xl mx-auto space-y-4 sm:space-y-6">
    
    <!-- ヘッダー・自店舗表示 -->
    <div class="bg-white rounded-xl shadow-md p-4 sm:p-6">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-2">
        <h2 id="storeTitle" class="text-lg sm:text-xl font-bold text-gray-800">店舗データを読み込み中...</h2>
        <span id="targetStoreBadge" class="bg-blue-100 text-blue-800 text-xs font-semibold px-3 py-1 rounded-full">専用ビュー</span>
      </div>
      
      <!-- サマリー集計 -->
      <div class="grid grid-cols-2 gap-2 sm:gap-4 mt-2 sm:mt-4">
        <div class="bg-blue-50 p-3 sm:p-4 rounded-lg text-center flex flex-col justify-center">
          <p class="text-xs sm:text-sm text-gray-500 mb-1">総回答数</p>
          <p class="text-2xl sm:text-3xl font-bold text-blue-600"><span id="count">0</span><span class="text-sm sm:text-lg text-blue-800 ml-1">件</span></p>
        </div>
        <div class="bg-green-50 p-3 sm:p-4 rounded-lg text-center flex flex-col justify-center">
          <p class="text-xs sm:text-sm text-gray-500 mb-1">NPSスコア</p>
          <p class="text-2xl sm:text-3xl font-bold text-green-600" id="npsScore">0</p>
        </div>
      </div>
    </div>

    <!-- 個別回答リスト -->
    <h3 class="text-md sm:text-lg font-bold text-gray-700 px-1">新着の回答コメント</h3>
    <div id="responseList" class="space-y-3 sm:space-y-4">
      <!-- 動的に入る -->
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDx8Q0of4f2AD-nChSIBmEr36Hn-2rQt-4",
      authDomain: "shoppana-nps-app-nodelete.firebaseapp.com",
      projectId: "shoppana-nps-app-nodelete",
      storageBucket: "shoppana-nps-app-nodelete.firebasestorage.app",
      messagingSenderId: "24600332490",
      appId: "1:24600332490:web:5c0a802af1a301d1a7cc33"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const targetStore = urlParams.get('store');

    if (targetStore) {
      document.getElementById('storeTitle').innerText = `${targetStore} の回答データ`;
    } else {
      document.getElementById('storeTitle').innerText = '店舗名が指定されていません';
      document.getElementById('targetStoreBadge').className = 'bg-red-100 text-red-800 text-xs font-semibold px-3 py-1 rounded-full';
      document.getElementById('targetStoreBadge').innerText = 'エラー';
    }

    const escapeHTML = str => (str || '').replace(/[&<>'"]/g, tag => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'}[tag]));

    let allSurveys = [];

    const renderResponses = () => {
      if (!targetStore) {
        document.getElementById('responseList').innerHTML = '<p class="text-red-500 text-center py-4 text-sm">URLに ?store=店舗名 を指定してください。</p>';
        return;
      }

      const filtered = allSurveys
        .filter(s => s.store === targetStore)
        .sort((a, b) => (b.timestamp?.toMillis() || 0) - (a.timestamp?.toMillis() || 0));

      const count = filtered.length;
      const promoters = filtered.filter(s => s.nps >= 9).length;
      const detractors = filtered.filter(s => s.nps <= 6).length;
      const npsScore = count === 0 ? 0 : Math.round(((promoters / count) - (detractors / count)) * 100);

      document.getElementById('count').innerText = count;
      document.getElementById('npsScore').innerText = npsScore;

      let html = '';
      filtered.forEach(data => {
        const date = data.timestamp ? new Date(data.timestamp.toMillis()).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '送信中...';
        const npsLabel = data.nps >= 9 ? '推奨者' : data.nps >= 7 ? '中立者' : '期待未達者';
        html += `
          <div class="bg-white p-3 sm:p-4 rounded-xl shadow-sm border-l-4 ${data.nps >= 9 ? 'border-green-500' : data.nps <= 6 ? 'border-red-500' : 'border-yellow-500'}">
            <div class="flex flex-col sm:flex-row sm:justify-between text-xs text-gray-400 mb-2 gap-1">
              <span>${date}</span>
              <span>${escapeHTML(data.gender)} | ${escapeHTML(data.time)}</span>
            </div>
            <div class="mb-2">
              <span class="bg-gray-100 text-gray-800 font-bold px-2 py-1 rounded text-xs sm:text-sm">NPS: ${data.nps}（${npsLabel}）</span>
            </div>
            <p class="text-gray-700 text-sm mt-1 whitespace-pre-wrap leading-relaxed">${escapeHTML(data.reason) || '<span class="text-gray-400">理由の記入なし</span>'}</p>
          </div>
        `;
      });
      document.getElementById('responseList').innerHTML = html || '<p class="text-gray-500 text-center py-4 text-sm">まだ回答がありません</p>';
    };

    onSnapshot(collection(db, "surveys"), (snapshot) => {
      allSurveys = [];
      snapshot.forEach(doc => allSurveys.push(doc.data()));
      renderResponses();
    });
  </script>
</body>
</html>
