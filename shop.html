<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>店舗ダッシュボード</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 font-sans">
  <div class="max-w-2xl mx-auto">
    <!-- ヘッダー・店舗選択 -->
    <div class="bg-white rounded-xl shadow-md p-6 mb-6">
      <h2 class="text-xl font-bold text-gray-700 mb-4">自店舗の回答データ確認</h2>
      <select id="storeSelect" class="w-full p-3 border rounded-lg bg-gray-50 outline-none focus:ring-2 focus:ring-blue-500">
        <option value="">店舗を読み込み中...</option>
      </select>
      
      <!-- サマリー集計 -->
      <div class="grid grid-cols-2 gap-4 mt-6">
        <div class="bg-blue-50 p-4 rounded-lg text-center">
          <p class="text-sm text-gray-500">総回答数</p>
          <p class="text-3xl font-bold text-blue-600"><span id="count">0</span><span class="text-lg text-blue-800">件</span></p>
        </div>
        <div class="bg-green-50 p-4 rounded-lg text-center">
          <p class="text-sm text-gray-500">NPSスコア</p>
          <p class="text-3xl font-bold text-green-600" id="npsScore">0</p>
        </div>
      </div>
    </div>

    <!-- 個別回答リスト -->
    <h3 class="text-lg font-bold text-gray-700 mb-3">新着の回答</h3>
    <div id="responseList" class="space-y-4">
      <!-- 動的に入る -->
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
  apiKey: "AIzaSyDx8Q0of4f2AD-nChSIBmEr36Hn-2rQt-4",
  authDomain: "shoppana-nps-app-nodelete.firebaseapp.com",
  projectId: "shoppana-nps-app-nodelete",
  storageBucket: "shoppana-nps-app-nodelete.firebasestorage.app",
  messagingSenderId: "24600332490",
  appId: "1:24600332490:web:5c0a802af1a301d1a7cc33"
};
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const storeSelect = document.getElementById('storeSelect');
    let allSurveys = [];

    const escapeHTML = str => (str || '').replace(/[&<>'"]/g, tag => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'}[tag]));

    const renderResponses = () => {
      const selectedStore = storeSelect.value;
      if (!selectedStore) return;

      const filtered = allSurveys
        .filter(s => s.store === selectedStore)
        .sort((a, b) => (b.timestamp?.toMillis() || 0) - (a.timestamp?.toMillis() || 0));

      // サマリー更新 (NPS計算処理)
      const count = filtered.length;
      const promoters = filtered.filter(s => s.nps >= 9).length;
      const detractors = filtered.filter(s => s.nps <= 6).length;
      const npsScore = count === 0 ? 0 : Math.round(((promoters / count) - (detractors / count)) * 100);

      document.getElementById('count').innerText = count;
      document.getElementById('npsScore').innerText = npsScore;

      // 個別回答リストの生成
      let html = '';
      filtered.forEach(data => {
        const date = data.timestamp ? new Date(data.timestamp.toMillis()).toLocaleString('ja-JP') : '送信中...';
        html += `
          <div class="bg-white p-4 rounded-xl shadow border-l-4 ${data.nps >= 9 ? 'border-green-500' : data.nps <= 6 ? 'border-red-500' : 'border-yellow-500'}">
            <div class="flex justify-between text-xs text-gray-400 mb-2">
              <span>${date}</span>
              <span>${escapeHTML(data.gender)} | ${escapeHTML(data.time)}</span>
            </div>
            <div class="flex items-center space-x-3 mb-2">
              <span class="bg-gray-100 text-gray-800 font-bold px-3 py-1 rounded-full text-sm">NPS: ${data.nps}</span>
            </div>
            <p class="text-gray-700 text-sm mt-2 whitespace-pre-wrap">${escapeHTML(data.reason) || '<span class="text-gray-400">理由の記入なし</span>'}</p>
          </div>
        `;
      });
      document.getElementById('responseList').innerHTML = html || '<p class="text-gray-500 text-center py-4">まだ回答がありません</p>';
    };

    onSnapshot(collection(db, "stores"), (snapshot) => {
      const currentSelection = storeSelect.value;
      storeSelect.innerHTML = '';
      snapshot.forEach(doc => {
        const option = document.createElement('option');
        option.value = doc.data().name;
        option.textContent = doc.data().name;
        storeSelect.appendChild(option);
      });
      if (currentSelection) storeSelect.value = currentSelection;
      renderResponses();
    });

    onSnapshot(collection(db, "surveys"), (snapshot) => {
      allSurveys = [];
      snapshot.forEach(doc => allSurveys.push(doc.data()));
      renderResponses();
    });

    storeSelect.addEventListener('change', renderResponses);
  </script>
</body>
</html>
