<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shoppana！アンケート</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-3 sm:p-6" style="font-family: 'Noto Sans JP', sans-serif;">
  <div class="max-w-2xl mx-auto">
    <h2 id="groupTitle" class="text-2xl sm:text-3xl font-bold text-center text-slate-800 mb-6 tracking-tight">Shoppana！アンケート</h2>
    
    <form id="surveyForm" class="space-y-6">
      
      <!-- 基本情報エリア -->
      <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 sm:p-8 space-y-6">
        <h3 class="text-lg font-bold text-indigo-700 border-b border-slate-100 pb-2">来場者情報</h3>
        
        <div class="flex flex-col">
          <label class="text-sm font-bold mb-2">①あなたの性別を教えてください。</label>
          <div class="flex gap-2 sm:gap-4">
            <label class="flex-1 flex items-center justify-center space-x-1.5 bg-slate-50 p-3 rounded-xl border border-slate-200 cursor-pointer hover:bg-slate-100 transition-colors"><input type="radio" name="gender" value="男" class="w-5 h-5 text-slate-600 accent-slate-600" required><span class="text-sm sm:text-base font-medium">男</span></label>
            <label class="flex-1 flex items-center justify-center space-x-1.5 bg-slate-50 p-3 rounded-xl border border-slate-200 cursor-pointer hover:bg-slate-100 transition-colors"><input type="radio" name="gender" value="女" class="w-5 h-5 text-slate-600 accent-slate-600"><span class="text-sm sm:text-base font-medium">女</span></label>
            <label class="flex-1 flex items-center justify-center space-x-1.5 bg-slate-50 p-3 rounded-xl border border-slate-200 cursor-pointer hover:bg-slate-100 transition-colors"><input type="radio" name="gender" value="無回答" class="w-5 h-5 text-slate-600 accent-slate-600"><span class="text-sm sm:text-base font-medium">無回答</span></label>
          </div>
        </div>

        <div class="flex flex-col">
          <label class="text-sm font-bold mb-2">②イベント来場時間を教えてください。</label>
          <div class="flex flex-col sm:flex-row gap-2 sm:gap-4">
            <label class="flex-1 flex items-center justify-center space-x-2 bg-slate-50 p-3 sm:p-4 rounded-xl border border-slate-200 cursor-pointer hover:bg-slate-100 transition-colors"><input type="radio" name="time" value="10:00～12:00" class="w-5 h-5 accent-slate-600" required><span class="font-medium">10：00～12：00</span></label>
            <label class="flex-1 flex items-center justify-center space-x-2 bg-slate-50 p-3 sm:p-4 rounded-xl border border-slate-200 cursor-pointer hover:bg-slate-100 transition-colors"><input type="radio" name="time" value="12:00～15:00" class="w-5 h-5 accent-slate-600"><span class="font-medium">12：00～15：00</span></label>
          </div>
        </div>
      </div>

      <!-- 店舗ごとの評価エリア -->
      <div id="storesArea" class="space-y-6">
        <p class="text-center text-slate-500 py-8">対象店舗を読み込み中...</p>
      </div>

      <button id="submitBtn" type="submit" class="w-full bg-slate-800 text-white text-lg font-bold py-4 sm:py-5 rounded-2xl shadow-md hover:bg-slate-900 transition-all transform mt-2">すべての回答を送信する</button>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDx8Q0of4f2AD-nChSIBmEr36Hn-2rQt-4",
      authDomain: "shoppana-nps-app-nodelete.firebaseapp.com",
      projectId: "shoppana-nps-app-nodelete",
      storageBucket: "shoppana-nps-app-nodelete.firebasestorage.app",
      messagingSenderId: "24600332490",
      appId: "1:24600332490:web:5c0a802af1a301d1a7cc33"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const targetGroup = urlParams.get('group');
    
    if(targetGroup) {
      document.getElementById('groupTitle').innerText = `Shoppana！アンケート (${targetGroup}グループ)`;
    }

    const storesArea = document.getElementById('storesArea');
    const submitBtn = document.getElementById('submitBtn');
    let targetStores = [];

    const escapeHTML = str => (str || '').replace(/[&<>'"]/g, tag => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'}[tag]));

    onSnapshot(collection(db, "stores"), (snapshot) => {
      targetStores = [];
      snapshot.forEach(doc => {
        const data = doc.data();
        if (data.group === targetGroup) {
          targetStores.push({ id: doc.id, name: data.name });
        }
      });

      if (targetStores.length === 0) {
        storesArea.innerHTML = '<div class="bg-rose-50 border border-rose-200 text-rose-700 p-6 rounded-2xl text-center font-bold">QRコード(URL)が正しくないか、このグループに店舗が登録されていません。</div>';
        submitBtn.disabled = true;
        submitBtn.className = "w-full bg-slate-300 text-white text-lg font-bold py-4 rounded-2xl mt-2 cursor-not-allowed";
        return;
      }

      let html = '';
      targetStores.forEach((store, index) => {
        html += `
          <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 sm:p-8 space-y-5">
            <h3 class="text-lg font-bold text-slate-800 border-b border-slate-100 pb-2">店舗${index + 1}：${escapeHTML(store.name)}</h3>
            
            <div class="flex flex-col">
              <label class="text-sm font-bold mb-2">家族や友人に、どの程度このお店をお薦めしたいと思いますか？</label>
              <select id="nps_${store.id}" class="text-base p-3 sm:p-4 border border-slate-200 rounded-xl bg-slate-50 focus:ring-2 focus:ring-slate-500 outline-none transition-shadow" required>
                <option value="">選択してください (1〜10)</option>
                <option value="1">1 (全く思わない)</option><option value="2">2</option><option value="3">3</option>
                <option value="4">4</option><option value="5">5</option><option value="6">6</option>
                <option value="7">7</option><option value="8">8</option><option value="9">9</option>
                <option value="10">10 (非常に強く思う)</option>
              </select>
            </div>

            <div class="flex flex-col">
              <label class="text-sm font-bold mb-2">その点数をつけた理由を教えてください。</label>
              <textarea id="reason_${store.id}" rows="3" class="text-base p-3 sm:p-4 border border-slate-200 rounded-xl bg-slate-50 focus:ring-2 focus:ring-slate-500 outline-none transition-shadow" placeholder="お店の良かった点、改善してほしい点など自由にご記入ください" required></textarea>
            </div>
          </div>
        `;
      });
      storesArea.innerHTML = html;
    });

    document.getElementById('surveyForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const gender = document.querySelector('input[name="gender"]:checked').value;
      const time = document.querySelector('input[name="time"]:checked').value;
      
      submitBtn.innerText = "送信中...";
      submitBtn.disabled = true;

      try {
        const promises = targetStores.map(store => {
          return addDoc(collection(db, "surveys"), {
            storeId: store.id,
            store: store.name,
            gender: gender,
            time: time,
            nps: parseInt(document.getElementById(`nps_${store.id}`).value),
            reason: document.getElementById(`reason_${store.id}`).value,
            timestamp: serverTimestamp()
          });
        });

        await Promise.all(promises);
        
        alert('すべての回答を送信しました。ご協力ありがとうございます。');
        e.target.reset();
        window.scrollTo(0, 0);
      } catch (error) {
        alert('エラーが発生しました。通信環境を確認し再度お試しください。');
      } finally {
        submitBtn.innerText = "すべての回答を送信する";
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
