<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shoppana！アンケート</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800 p-4" style="font-family: 'Noto Sans JP', sans-serif;">
  <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6 mt-4">
    <h2 class="text-3xl font-bold text-center text-blue-600 mb-8">Shoppana！アンケート</h2>
    <form id="surveyForm" class="space-y-8">
      
      <div class="flex flex-col">
        <label class="text-lg font-bold mb-3">対象店舗</label>
        <select id="store" class="text-lg p-4 border rounded-lg bg-gray-50 focus:ring-2 focus:ring-blue-500 outline-none" required>
          <option value="">店舗を読み込み中...</option>
        </select>
      </div>

      <div class="flex flex-col">
        <label class="text-lg font-bold mb-3">①あなたの性別を教えてください。</label>
        <div class="flex flex-wrap gap-4">
          <label class="flex items-center space-x-3 bg-gray-50 p-3 rounded-lg border w-full sm:w-auto"><input type="radio" name="gender" value="男" class="w-6 h-6 text-blue-600" required><span class="text-lg">男</span></label>
          <label class="flex items-center space-x-3 bg-gray-50 p-3 rounded-lg border w-full sm:w-auto"><input type="radio" name="gender" value="女" class="w-6 h-6 text-blue-600"><span class="text-lg">女</span></label>
          <label class="flex items-center space-x-3 bg-gray-50 p-3 rounded-lg border w-full sm:w-auto"><input type="radio" name="gender" value="無回答" class="w-6 h-6 text-blue-600"><span class="text-lg">無回答</span></label>
        </div>
      </div>

      <div class="flex flex-col">
        <label class="text-lg font-bold mb-3">②イベント来場時間を教えてください。</label>
        <div class="space-y-3">
          <label class="flex items-center space-x-3 bg-gray-50 p-3 rounded-lg border"><input type="radio" name="time" value="10:00～12:00" class="w-6 h-6 text-blue-600" required><span class="text-lg">10：00～12：00</span></label>
          <label class="flex items-center space-x-3 bg-gray-50 p-3 rounded-lg border"><input type="radio" name="time" value="12:00～15:00" class="w-6 h-6 text-blue-600"><span class="text-lg">12：00～15：00</span></label>
        </div>
      </div>

      <div class="flex flex-col">
        <label class="text-lg font-bold mb-3">③家族や友人に、どの程度お店をお薦めしたいと思いますか？</label>
        <select id="nps" class="text-lg p-4 border rounded-lg bg-gray-50 focus:ring-2 focus:ring-blue-500 outline-none" required>
          <option value="">選択してください (1〜10)</option>
          <option value="1">1 (全く思わない)</option>
          <option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option>
          <option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option>
          <option value="10">10 (非常に強く思う)</option>
        </select>
      </div>

      <div class="flex flex-col">
        <label class="text-lg font-bold mb-3">④その点数をつけた理由を教えてください。</label>
        <textarea id="reason" rows="4" class="text-lg p-4 border rounded-lg bg-gray-50 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="自由にご記入ください" required></textarea>
      </div>

      <button type="submit" class="w-full bg-blue-600 text-white text-xl font-bold py-4 rounded-lg shadow-lg hover:bg-blue-700 transition duration-200 mt-4">送信する</button>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDx8Q0of4f2AD-nChSIBmEr36Hn-2rQt-4",
      authDomain: "shoppana-nps-app-nodelete.firebaseapp.com",
      projectId: "shoppana-nps-app-nodelete",
      storageBucket: "shoppana-nps-app-nodelete.firebasestorage.app",
      messagingSenderId: "24600332490",
      appId: "1:24600332490:web:5c0a802af1a301d1a7cc33"
    };
    
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const storeSelect = document.getElementById('store');
    onSnapshot(collection(db, "stores"), (snapshot) => {
      storeSelect.innerHTML = '<option value="">店舗を選択してください</option>';
      snapshot.forEach(doc => {
        const option = document.createElement('option');
        option.value = doc.data().name;
        option.textContent = doc.data().name;
        storeSelect.appendChild(option);
      });
    });

    document.getElementById('surveyForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await addDoc(collection(db, "surveys"), {
          store: document.getElementById('store').value,
          gender: document.querySelector('input[name="gender"]:checked').value,
          time: document.querySelector('input[name="time"]:checked').value,
          nps: parseInt(document.getElementById('nps').value),
          reason: document.getElementById('reason').value,
          timestamp: serverTimestamp()
        });
        alert('回答を送信しました。ご協力ありがとうございます。');
        e.target.reset();
      } catch (error) {
        alert('エラーが発生しました。時間を置いて再度お試しください。');
        console.error("Error adding document: ", error);
      }
    });
  </script>
</body>
</html>
